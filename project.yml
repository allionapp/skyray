name: SkyRay
options:
  bundleIdPrefix: com.allion
  developmentLanguage: en
  knownRegions: [en, fa]
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Set your Apple Developer Team ID here (Xcode > Signing & Capabilities) to run on a real device.
    DEVELOPMENT_TEAM: SG5BT8WSLT
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    OTHER_LDFLAGS: "-ObjC -lresolv"
targets:
  SkyRay:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.allion.skyray
        PRODUCT_NAME: SkyRay
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "4"
    dependencies:
      - target: PacketTunnel
        embed: true
      - framework: Frameworks/LibXray.xcframework
        embed: false
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: SkyRay
        CFBundleShortVersionString: "0.4.0"
        CFBundleVersion: "4"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: "Used to scan server QR codes."
        ITSAppUsesNonExemptEncryption: false
        CFBundleLocalizations: [en, fa]
        UIAppFonts: [Archivo.ttf, IBMPlexMono-Regular.ttf, IBMPlexMono-Medium.ttf]
        CFBundleURLTypes:
          - CFBundleURLName: com.allion.skyray
            CFBundleURLSchemes: [skyray]
        CFBundleDevelopmentRegion: en
    entitlements:
      path: App/SkyRay.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [group.com.allion.skyray]
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
        excludes: ["Info.plist"]
      - path: Shared
    dependencies:
      - framework: Frameworks/LibXray.xcframework
        embed: false
      - framework: Frameworks/HevSocks5Tunnel.xcframework
        embed: false
      - sdk: NetworkExtension.framework
    info:
      path: PacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: SkyRay Tunnel
        CFBundleShortVersionString: "0.4.0"
        CFBundleVersion: "4"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: PacketTunnel/PacketTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [group.com.allion.skyray]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.allion.skyray.PacketTunnel
        PRODUCT_NAME: PacketTunnel
        MARKETING_VERSION: "0.4.0"
        CURRENT_PROJECT_VERSION: "4"
schemes:
  SkyRay:
    build:
      targets:
        SkyRay: all
    run:
      config: Debug
    archive:
      config: Release
